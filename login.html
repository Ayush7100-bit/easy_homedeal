<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | EasyHome Deals</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>


    <!-- Navbar -->

    <header class="navbar">

        <div class="logo">
            EasyHome Deals
        </div>

        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="index.html#properties">
                Properties
            </a>

            <a href="index.html#locations">
                Locations
            </a>

            <a href="index.html#about">
                About
            </a>

        </nav>

    </header>


    <!-- Login Section -->

    <section class="auth-section">

        <div class="auth-container">

            <div class="auth-content">

                <p class="auth-small-title">
                    EASYHOME DEALS
                </p>

                <h1>
                    Welcome Back
                </h1>

                <p class="auth-description">
                    Login to your account to explore rental
                    properties and manage your enquiries.
                </p>


                <!-- Login Form -->

                <form id="loginForm">

                    <div class="auth-form-group">

                        <label for="loginEmail">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="loginEmail"
                            placeholder="Enter your email"
                            required
                        >

                    </div>


                    <div class="auth-form-group">

                        <label for="loginPassword">
                            Password
                        </label>

                        <input
                            type="password"
                            id="loginPassword"
                            placeholder="Enter your password"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="auth-btn"
                    >
                        Login
                    </button>

                </form>


                <p
                    id="loginMessage"
                    class="auth-message"
                ></p>


                <p class="auth-switch">

                    Don't have an account?

                    <a href="register.html">
                        Create Account
                    </a>

                </p>

            </div>

        </div>

    </section>


    <!-- Footer -->

    <footer class="footer">

        <p>
            © 2026 EasyHome Deals. All rights reserved.
        </p>

    </footer>


    <script src="js/login.js"></script>

</body>

</html>
