<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | EasyHome Deals</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navbar -->

    <header class="navbar">

        <div class="logo">
            EasyHome Deals
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="index.html#properties">Properties</a>
            <a href="index.html#locations">Locations</a>
            <a href="index.html#about">About</a>
        </nav>

    </header>


    <!-- Register Section -->

    <section class="auth-section">

        <div class="auth-container">

            <div class="auth-content">

                <p class="auth-small-title">
                    EASYHOME DEALS
                </p>

                <h1>
                    Create Your Account
                </h1>

                <p class="auth-description">
                    Register to explore rental properties and connect
                    with property owners.
                </p>


                <!-- Register Form -->

                <form id="registerForm">

                    <div class="auth-form-group">

                        <label for="registerName">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="registerName"
                            placeholder="Enter your full name"
                            required
                        >

                    </div>


                    <div class="auth-form-group">

                        <label for="registerEmail">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="registerEmail"
                            placeholder="Enter your email"
                            required
                        >

                    </div>


                    <div class="auth-form-group">

                        <label for="registerPhone">
                            Phone Number
                        </label>

                        <input
                            type="tel"
                            id="registerPhone"
                            placeholder="Enter your phone number"
                            required
                        >

                    </div>


                    <div class="auth-form-group">

                        <label for="registerPassword">
                            Password
                        </label>

                        <input
                            type="password"
                            id="registerPassword"
                            placeholder="Create a password"
                            required
                        >

                    </div>


                    <div class="auth-form-group">

                        <label for="confirmPassword">
                            Confirm Password
                        </label>

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Confirm your password"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="auth-btn"
                    >
                        Create Account
                    </button>

                </form>


                <p
                    id="registerMessage"
                    class="auth-message"
                ></p>


                <p class="auth-switch">

                    Already have an account?

                    <a href="login.html">
                        Login here
                    </a>

                </p>

            </div>

        </div>

    </section>


    <!-- Footer -->

    <footer class="footer">

        <p>
            © 2026 EasyHome Deals. All rights reserved.
        </p>

    </footer>


 <script src="js/register.js"></script>

</body>
</html>
